submission:
  title: ""                            # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    Social Media has become a primary source of spreading ideas, expressing opinions, and communicate 
    with people all over the globe. With millions of new data being fed into social media every single day,
    it is impossible to keep a track of all this data for threats through manual methods. Thus we need to
    implement a tool to automate this process so that we can assess any possible threat much faster.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    X is a tool designed to run through all the posts, messages, videos or any other form of social media communication
    such that it flags any specific media that poses any sort of threat or problem to our attention which can then
    easily be dealt with manually and we can easily perform the needed action to prevent the threat.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - ""                               # e.g., "Real-time pipeline anomaly detection using watsonx.ai"
    - ""
    - ""
    - ""                               # optional 4th
    - ""                               # optional 5th

  tech_stack:
    languages: []                      # REQUIRED — e.g., ["Python", "TypeScript"]
    frameworks: []                     # e.g., ["FastAPI", "React"]
    ibm_technologies: []               # e.g., ["watsonx.ai", "IBM Bob", "IBM Cloud Functions"]
    databases: []                      # e.g., ["PostgreSQL", "Redis"]
    other: []                          # e.g., ["Docker", "GitHub Actions", "Slack API"]

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
    Replace with what aspect of the submission you consider strongest
    and want judges to pay special attention to.

  known_limitations: >                 # Optional but recommended — be honest about gaps
    Replace with any known limitations, incomplete features,
    or shortcuts taken due to time constraints.

